# Grafana Dashboard Provisioning
# Phase 7: Performance Monitoring

apiVersion: 1

providers:
  - name: 'Auto-Trading Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
